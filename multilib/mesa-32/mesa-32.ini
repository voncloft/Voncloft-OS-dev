[binaries]
c = ['gcc', '-m32']
cpp = ['g++', '-m32']
rust = ['rustc', '--target', 'i686-unknown-linux-gnu']
pkg-config = 'pkg-config'
llvm-config = '/usr/bin/llvm-config-32'
ar = 'ar'
strip = 'strip'

[properties]
pkg_config_libdir = ['/usr/lib32/pkgconfig', '/usr/share/pkgconfig']

[built-in options]
pkg_config_path = ['/usr/lib32/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
