# The existing SysV network script configures enp0s31f6 as 192.168.1.150/24.
# Keep that connection and the existing resolver file when NetworkManager starts.
# Revisit these settings if the static connection is migrated to NetworkManager.
[main]
rc-manager=unmanaged
no-auto-default=enp0s31f6

[device-vonos-static-ethernet]
match-device=interface-name:enp0s31f6
keep-configuration=yes
